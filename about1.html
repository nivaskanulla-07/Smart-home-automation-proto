    .components-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .component-card {
      background: rgba(255, 255, 255, 0.72);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .component-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 24px rgba(0, 0, 0, 0.13);
    }

    .component-card img {
      width: 100%;
      height: 155px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
    }

    .component-card h3 {
      margin: 12px 4px 2px;
      font-size: 1rem;
    }

    .single-document {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    @media (max-width: 900px) {
      .components-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .components-grid {
        grid-template-columns: 1fr;
      }

      .component-card img {
        height: 180px;
      }
    }

</style>

  <style id="about-page">
    /* Same translucent appearance as the main site */
    .about-panel {
      background: rgba(255, 255, 255, 0.15) !important;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 18px;
      padding: 28px;
      margin-top: 20px;
    }

    .about-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .about-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .about-title .about-icon {
      font-size: 42px;
    }

    .about-title h1 {
      margin: 0;
    }

    .about-title p {
      margin: 5px 0 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      background: #10244b;
      color: white;
      font-weight: 600;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(16, 36, 75, 0.12);
      border-radius: 15px;
      padding: 20px;
    }

    .info-card h2 {
      margin-top: 0;
      color: #10244b;
    }

    .info-card p {
      line-height: 1.65;
    }

    .component-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .component-list li {
      padding: 11px 13px;
      border-radius: 10px;
      background: rgba(255,255,255,0.72);
    }

    .flow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .flow-box {
      padding: 12px 15px;
      border-radius: 10px;
      background: rgba(255,255,255,0.78);
      font-weight: 600;
      text-align: center;
    }

    .arrow {
      font-size: 22px;
      font-weight: bold;
    }

    .doc-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .doc-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 15px;
      border-radius: 10px;
      text-decoration: none;
      background: #10244b;
      color: white;
      font-weight: 600;
    }

    .doc-btn.disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .team-table-wrap {
      overflow-x: auto;
    }

    .team-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
    }

    .team-table th,
    .team-table td {
      padding: 11px;
      border-bottom: 1px solid rgba(16,36,75,0.12);
      text-align: left;
    }

    .team-table th {
      color: #10244b;
    }

    @media (max-width: 700px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .about-panel {
        padding: 18px;
      }
    }
  </style>
</head>
